<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kill Ledger</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=IBM+Plex+Sans+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECEBF0; --surface:#F7F6FA; --surface-2:#E2E0EA; --line:#CFCBDB; --ink:#1C1932; --muted:#625C7E;
  --jade:#0B7A68; --jade-ink:#06493F; --gold:#C8922A; --gold-ink:#3B2905; --void:#3A2F6B; --warn:#A23B4A;
  --serif:"Cormorant Garamond", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --sans:"IBM Plex Sans Condensed", "Arial Narrow", "Roboto Condensed", "Helvetica Neue", Arial, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14112A; --surface:#1C1838; --surface-2:#252046; --line:#342E5C; --ink:#ECE6D6; --muted:#A29BC2;
    --jade:#45C3AA; --jade-ink:#D9FFF6; --gold:#E2B453; --gold-ink:#2A1C02; --void:#B9A8FF; --warn:#F08A9A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14112A; --surface:#1C1838; --surface-2:#252046; --line:#342E5C; --ink:#ECE6D6; --muted:#A29BC2;
  --jade:#45C3AA; --jade-ink:#D9FFF6; --gold:#E2B453; --gold-ink:#2A1C02; --void:#B9A8FF; --warn:#F08A9A;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:16px; line-height:1.45; -webkit-font-smoothing:antialiased; font-variant-numeric:tabular-nums}
a{color:inherit}
button,input,select{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--jade); outline-offset:2px}
.wrap{max-width:1360px; margin:0 auto; padding:20px clamp(14px,3vw,36px) 48px}

/* masthead */
.mast{display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:12px 24px; padding-bottom:14px; border-bottom:1px solid var(--line)}
.mast h1{font-family:var(--serif); font-weight:600; font-size:clamp(28px,4.2vw,46px); line-height:1.02; margin:0; letter-spacing:.005em}
.mast h1 a{text-decoration:none}
.mast .sub{color:var(--muted); margin-top:6px; font-size:15px}
.mast .tool{font-family:var(--serif); font-style:italic; font-size:18px; color:var(--void)}
.themebtn{border:1px solid var(--line); background:transparent; border-radius:999px; padding:4px 12px; cursor:pointer; color:var(--muted); font-size:13px}

/* controls */
.controls{display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center; padding:14px 0 6px}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; background:var(--surface)}
.seg button{border:0; background:transparent; padding:6px 12px; cursor:pointer; font-size:14px; color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--bg)}
.seglabel{font-size:13px; color:var(--muted); margin-right:6px}
details.assume{flex-basis:100%; border-top:1px dashed var(--line); padding-top:8px}
details.assume summary{cursor:pointer; color:var(--muted); font-size:14px; list-style:none}
details.assume summary::-webkit-details-marker{display:none}
details.assume summary::before{content:"+ "; color:var(--jade); font-weight:600}
details.assume[open] summary::before{content:"− "}
.assume-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:14px 28px; padding:12px 0 4px}
.assume-grid h3{font-size:14px; margin:0 0 6px; font-weight:600}
.tog{display:flex; gap:10px; align-items:flex-start; padding:4px 0; cursor:pointer; font-size:14px}
.tog input{margin-top:3px; accent-color:var(--jade)}
.tog small{display:block; color:var(--muted); font-size:12.5px; line-height:1.35}
.presets{display:flex; gap:8px; flex-wrap:wrap; padding:6px 0 4px}
.btn{border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:6px 12px; cursor:pointer; font-size:14px}
.btn:hover{border-color:var(--jade)}
.btn.primary{background:var(--jade); border-color:var(--jade); color:var(--bg)}

/* formula strip */
.legend{display:flex; flex-wrap:wrap; gap:8px 28px; align-items:baseline; padding:14px 0 10px}
.legend .eq{font-family:var(--serif); font-size:clamp(19px,2.2vw,24px); font-weight:600}
.legend .eq em{font-style:italic; font-weight:500; color:var(--muted)}
.keyrow{display:flex; gap:14px; flex-wrap:wrap; font-size:13px; color:var(--muted)}
.sw{display:inline-block; width:14px; height:14px; border-radius:3px; vertical-align:-2px; margin-right:5px; border:1px solid var(--line)}

/* matrix */
.mx-scroll{overflow-x:auto; border:1px solid var(--line); border-radius:10px; background:var(--surface)}
table.mx{border-collapse:separate; border-spacing:0; width:max-content; min-width:100%; font-size:13.5px}
.mx th,.mx td{padding:0; border-bottom:1px solid var(--line)}
.mx thead th{position:sticky; top:0; background:var(--surface); z-index:2; vertical-align:bottom}
.mx .grp th{font-weight:500; font-size:12.5px; color:var(--muted); text-align:left; padding:8px 8px 4px; border-bottom:0}
.mx .grp th.inf{border-left:2px solid var(--jade)}
.mx .grp th.veh{border-left:2px solid var(--void)}
.mx th.tg{width:62px; min-width:62px; text-align:left; font-weight:500}
.mx th.tg a{display:block; padding:6px 6px 8px; text-decoration:none; line-height:1.15; min-height:76px}
.mx th.tg a:hover .tn{text-decoration:underline}
.mx th.tg .tn{display:block; font-size:12.5px}
.mx th.tg .tm{display:block; color:var(--muted); font-size:11.5px; margin-top:3px}
.mx th.tg.first-veh, .mx td.first-veh{border-left:2px solid var(--void)}
.mx th.tg.first-inf, .mx td.first-inf{border-left:2px solid var(--jade)}
.mx th.rowh, .mx td.rowh{position:sticky; left:0; z-index:1; background:var(--surface); text-align:left; min-width:190px; max-width:230px; border-right:1px solid var(--line)}
.mx thead th.rowh{z-index:3}
.mx td.rowh a{display:block; padding:7px 10px; text-decoration:none}
.mx td.rowh a:hover .un{text-decoration:underline}
.mx .un{font-weight:600; display:block; line-height:1.2}
.mx .um{color:var(--muted); font-size:12px}
.mx td.c a{display:flex; align-items:center; justify-content:center; height:40px; text-decoration:none; font-variant-numeric:tabular-nums}
.mx td.c a:hover{outline:2px solid var(--ink); outline-offset:-2px}
.mx td.c.eff a{font-weight:600}
.mx td.agg{text-align:center; font-weight:600; padding:0 10px; color:var(--muted); background:var(--surface)}
.mx td.agg.best{font-weight:500; text-align:left; font-size:12.5px; max-width:120px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.mx tr.sec td{background:var(--surface-2); font-size:12.5px; color:var(--muted); padding:5px 10px; position:sticky; left:0}
.mx tr.cov td{font-size:12.5px; color:var(--muted); text-align:center; padding:8px 0; border-bottom:0}
.mx tr.cov td.rowh{padding:8px 10px; text-align:left}
.mx tr.cov td.zero{color:var(--warn); font-weight:600}

/* findings */
.findings{display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:12px 28px; margin:22px 0 4px; padding:0; list-style:none}
.findings li{border-left:3px solid var(--jade); padding:2px 0 2px 12px; font-size:15px}
.findings li.alert{border-left-color:var(--warn)}
.findings li.gold{border-left-color:var(--gold)}
.findings b{font-weight:600}
.findings a{color:var(--jade)}

/* dossier */
.crumbs{font-size:14px; padding:14px 0 0}
.crumbs a{color:var(--jade); text-decoration:none}
.crumbs a:hover{text-decoration:underline}
.dhead{display:flex; flex-wrap:wrap; justify-content:space-between; align-items:flex-end; gap:10px 24px; padding:8px 0 14px; border-bottom:1px solid var(--line)}
.dhead h2{font-family:var(--serif); font-weight:600; font-size:clamp(32px,5vw,58px); line-height:1; margin:0}
.dhead .meta{color:var(--muted); margin-top:8px; font-size:15px}
.dhead .ptsbig{font-family:var(--serif); font-size:clamp(28px,3.6vw,40px); font-weight:600; text-align:right; line-height:1}
.dhead .ptsbig small{display:block; font-family:var(--sans); font-size:13px; font-weight:400; color:var(--muted); margin-top:4px}
.dgrid{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.15fr); gap:28px; padding-top:18px}
@media (max-width: 900px){ .dgrid{grid-template-columns:minmax(0,1fr)} }
.dgrid > section{min-width:0}
@media (max-width: 560px){
  .mx th.rowh, .mx td.rowh{min-width:132px; max-width:150px}
  .mx td.rowh a{padding:6px 8px}
  .mx .un{font-size:13px}
  .mx .um{font-size:11px}
  .dhead .ptsbig{text-align:left}
  .bars li{grid-template-columns:minmax(96px,128px) 1fr 44px; gap:8px}
}
.dgrid h3{font-size:15px; font-weight:600; margin:0 0 10px}
.dgrid h3 span{font-weight:400; color:var(--muted)}

.bars{list-style:none; margin:0; padding:0}
.bars li{display:grid; grid-template-columns:minmax(110px,150px) 1fr 52px; gap:10px; align-items:center; padding:3px 0}
.bars a.bn{font-size:13.5px; text-decoration:none; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.bars a.bn:hover{text-decoration:underline}
.bars li.sel a.bn{font-weight:600}
.track{position:relative; height:18px; background:var(--surface-2); border-radius:4px; overflow:hidden; cursor:pointer}
.track .fill{position:absolute; inset:0 auto 0 0; border-radius:4px}
.track .mk{position:absolute; top:0; bottom:0; width:1px; background:var(--ink); opacity:.35}
.track .mk.m100{opacity:.6}
.bars .bv{text-align:right; font-weight:600; font-size:14px}
.bars li.sel .track{outline:2px solid var(--ink); outline-offset:1px}
.bars .cls{font-size:12px; color:var(--muted); padding:10px 0 2px; display:block}

.tbl-scroll{overflow-x:auto; border:1px solid var(--line); border-radius:10px; background:var(--surface)}
table.dt{border-collapse:collapse; width:100%; font-size:13.5px; min-width:640px}
.dt th{text-align:right; font-weight:500; color:var(--muted); padding:8px 8px; border-bottom:1px solid var(--line); font-size:12.5px; white-space:nowrap}
.dt th:first-child,.dt td:first-child{text-align:left}
.dt td{text-align:right; padding:7px 8px; border-bottom:1px solid var(--line); vertical-align:top}
.dt tr:last-child td{border-bottom:0}
.dt .wn{font-weight:600}
.dt .wnotes{display:block; font-size:12px; color:var(--jade); font-weight:400}
.dt tr.skip td{color:var(--muted)}
.dt tr.skip .wnotes{color:var(--muted)}
.dt td.dealt{font-weight:600}
.dt .sub{display:block; font-size:11.5px; color:var(--jade); white-space:nowrap}
.dt input{width:52px; padding:3px 5px; border:1px solid var(--line); border-radius:5px; background:var(--bg); text-align:right}
.dt input.kwin{width:150px; text-align:left}
.dt input.nmin{width:100%; min-width:150px; text-align:left}

/* the sigma */
.sigma{margin-top:16px; padding:18px 18px 16px; border-radius:12px; background:var(--surface); border:1px solid var(--line); position:relative}
.sigma .line{display:flex; flex-wrap:wrap; align-items:flex-end; gap:6px 12px; font-family:var(--serif); font-weight:600; font-size:clamp(22px,2.7vw,36px); line-height:1}
.sigma .term{display:inline-flex; flex-direction:column; align-items:center}
.sigma .term small{font-family:var(--sans); font-weight:400; font-size:12px; color:var(--muted); margin-top:6px; white-space:nowrap}
.sigma .op{color:var(--muted); font-weight:500}
.sigma .res{color:var(--jade)}
.sigma .res.hi{color:var(--gold)}
.sigma .res.lo{color:var(--warn)}
.sigma p{margin:14px 0 0; font-size:15px; max-width:70ch}
.sigma p.alt{color:var(--muted); font-size:14px; margin-top:6px}
.empty{color:var(--muted); padding:22px; border:1px dashed var(--line); border-radius:10px; text-align:center}

.tprof{display:flex; flex-wrap:wrap; gap:8px 22px; padding:12px 0 4px; font-size:15px}
.tprof label{display:flex; flex-direction:column; font-size:12px; color:var(--muted); gap:3px}
.tprof input{width:70px; padding:5px 7px; border:1px solid var(--line); border-radius:6px; background:var(--surface); font-size:15px; color:var(--ink)}
.tprof input.wide{width:120px}
.tprof .ro{font-size:20px; color:var(--ink); font-weight:600}



/* modifier bar */
.modwrap{flex-basis:100%; border-top:1px dashed var(--line); padding-top:8px}
.modwrap > summary{cursor:pointer; color:var(--muted); font-size:14px; list-style:none}
.modwrap > summary::-webkit-details-marker{display:none}
.modwrap > summary::before{content:"+ "; color:var(--jade); font-weight:600}
.modwrap[open] > summary::before{content:"− "}
.mbreak{flex-basis:100%; height:0}
.mcluster.c3{border-left:0; padding-left:0}
.modbar{display:flex; flex-wrap:wrap; align-items:flex-start; gap:14px 0; padding:12px 0 2px}
.mcluster{display:flex; flex-wrap:wrap; align-items:flex-start; gap:12px 16px; padding:0 20px; border-left:1px solid var(--line)}
.mcluster:first-child{padding-left:0; border-left:0}
.mg{display:flex; flex-direction:column; gap:5px; min-width:0; max-width:100%}
.mcluster{min-width:0; max-width:100%}
.ml{font-size:12.5px; color:var(--muted)}
.mnote{font-size:11.5px; color:var(--muted); max-width:190px; line-height:1.3}
.seg{max-width:100%; flex-wrap:wrap}
.seg.sm button{padding:4px 10px; font-size:13px}
.seg.sm button[aria-pressed="true"]:not([data-mval="0"]):not([data-mval="false"]):not([data-mval="off"]):not([data-mval="both"]){background:var(--jade); color:var(--bg)}
#modscope{box-sizing:border-box; padding:5px 8px; border:1px solid var(--line); border-radius:8px; background:var(--surface); color:var(--ink); min-width:210px; max-width:270px; font-size:14px}
.btn.ghost{background:transparent; align-self:flex-end; margin-left:20px; font-size:13px}
.modsum{flex-basis:100%; margin:6px 0 0; font-size:13px; color:var(--muted); max-width:110ch}
.modsum b{color:var(--ink); font-weight:600}
.modtag{display:inline-block; margin-left:6px; font-size:10.5px; font-weight:600; padding:1px 6px; border-radius:999px; background:color-mix(in oklab, var(--gold) 38%, var(--surface)); color:var(--ink); vertical-align:2px}
@media (max-width: 760px){
  .mcluster{border-left:0; padding:0; flex-basis:100%}
  .modbar{gap:12px}
  .btn.ghost{margin-left:0}
  #modscope{min-width:0; width:100%; max-width:none}
  .mcluster:first-child .mg:first-child{flex-basis:100%}
}


/* lists and import */
.mastctl{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
#listpick{box-sizing:border-box; padding:5px 8px; border:1px solid var(--line); border-radius:999px; background:var(--surface); color:var(--ink); font-size:13px; max-width:340px}
.chip.todo{background:transparent; border:1px dashed var(--warn); color:var(--ink)}
.chip.todo::before{content:"!\00a0"; color:var(--warn); font-weight:700}
.impform{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.4fr); gap:16px 24px; padding:18px 0 6px; align-items:start}
@media (max-width: 760px){ .impform{grid-template-columns:minmax(0,1fr)} }
.impform label{display:flex; flex-direction:column; gap:6px; font-size:14px; font-weight:600}
.impform .drop{border:1px dashed var(--line); border-radius:12px; padding:16px; background:var(--surface)}
.impform .drop input{font-weight:400}
.impform textarea{box-sizing:border-box; width:100%; padding:10px; border:1px solid var(--line); border-radius:10px; background:var(--surface); color:var(--ink); font:400 13px/1.4 var(--sans); resize:vertical}
.impform .presets{grid-column:1/-1}
.btn[disabled]{opacity:.5; cursor:not-allowed}
.btn.danger{color:var(--warn)}
.err{grid-column:1/-1; color:var(--warn); margin:0}
.warns{margin:6px 0 12px; padding-left:18px; color:var(--muted); font-size:13.5px}
.warns li{margin:2px 0}
.impname{display:flex; flex-direction:column; gap:4px; font-size:13px; color:var(--muted); max-width:420px; margin-bottom:8px}
.impname input{box-sizing:border-box; padding:7px 9px; border:1px solid var(--line); border-radius:8px; background:var(--surface); color:var(--ink); font:600 16px var(--sans)}
.ptsmini{box-sizing:border-box; width:64px; padding:3px 6px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--ink); text-align:right}
table.dt.imp td .um{display:block; color:var(--muted); font-size:12px}
.imp-review, .mylists{margin-top:22px}

/* tabs */
.tabs{display:flex; gap:22px; padding:14px 0 0; border-bottom:1px solid var(--line)}
.tabs a{text-decoration:none; color:var(--muted); padding:6px 0 9px; font-size:15px; border-bottom:2px solid transparent; margin-bottom:-1px}
.tabs a[aria-current="page"]{color:var(--ink); border-bottom-color:var(--jade); font-weight:600}
.tabs a:hover{color:var(--ink)}
.hint{color:var(--muted); font-size:13px; font-weight:400}
small.hint{display:block; margin-top:6px}
.by{color:var(--muted); font-size:12.5px}
.assume-grid h3 .hint{font-size:12px; margin-left:4px}
h3.sh{font-size:15px; font-weight:600; margin:26px 0 10px}
section > h3.sh:first-child{margin-top:0}
h3.sh span{font-weight:400; color:var(--muted)}
.mx th.corner{text-align:left; padding:6px 10px; font-weight:500; color:var(--muted); font-size:12.5px}
.mx th.aggh{text-align:center; padding:6px; color:var(--muted); font-weight:500}
.mx th.aggh.l{text-align:left}
.dt td.l, .dt th.l{text-align:left}
.emptyrow{text-align:center !important; color:var(--muted)}
.editbar{display:flex; gap:10px; margin:0 0 10px; flex-wrap:wrap; align-items:center; font-size:14px}
.editbar label{display:flex; gap:6px; align-items:center}
.ptsin{width:70px; padding:5px; border:1px solid var(--line); border-radius:6px; background:var(--bg)}
.lede{margin:8px 0 0; color:var(--muted); font-size:14.5px; flex-basis:100%; max-width:75ch}

/* chips */
.chip{display:inline-block; white-space:nowrap; font:inherit; font-size:12.5px; line-height:1.2; padding:4px 9px; margin:2px 4px 2px 0; border-radius:999px; cursor:pointer; border:1px solid transparent; text-align:left}
.chip.on{background:color-mix(in oklab, var(--jade) 22%, var(--surface)); border-color:color-mix(in oklab, var(--jade) 55%, var(--surface)); color:var(--ink)}
.chip.on::before{content:"\2713\00a0"; color:var(--jade); font-weight:700}
.chip.idle{background:transparent; border:1px dashed color-mix(in oklab, var(--jade) 60%, var(--surface)); color:var(--muted)}
.chip.idle::before{content:"\25CB\00a0"; color:var(--jade)}
.chip.off{background:transparent; border-color:color-mix(in oklab, var(--jade) 45%, var(--surface)); color:var(--muted); text-decoration:line-through}
.chip.mark-off{background:transparent; border:1px dashed var(--gold); color:var(--ink)}
.chip.mark-on{background:color-mix(in oklab, var(--gold) 40%, var(--surface)); border-color:var(--gold); color:var(--ink)}
.chip.mark-on::before{content:"\25C6\00a0"; color:var(--gold-ink)}
.chip.note{background:var(--surface-2); color:var(--muted); border-color:transparent}
.chip.sel{outline:2px solid var(--ink); outline-offset:1px}
.chip.demo{cursor:default; margin-right:4px}
.chips{display:flex; flex-wrap:wrap; gap:2px}

/* rules matrix */
.armyrules{margin:6px 0 16px}
.armyrules h3{font-size:14px; font-weight:600; margin:0 0 6px}
.armygrid{display:flex; flex-wrap:wrap; gap:6px 22px}
.armyrule{display:flex; align-items:center; gap:6px; font-size:13px; color:var(--muted)}
table.rx{border-collapse:separate; border-spacing:0; width:100%; min-width:980px; font-size:13.5px}
.rx th{position:sticky; top:0; background:var(--surface); z-index:2; text-align:left; font-weight:500; color:var(--muted); font-size:12.5px; padding:8px 10px; border-bottom:1px solid var(--line)}
.rx td{vertical-align:top; padding:7px 10px; border-bottom:1px solid var(--line)}
.rx th.rowh, .rx td.rowh{position:sticky; left:0; z-index:1; background:var(--surface); min-width:180px; border-right:1px solid var(--line)}
.rx thead th.rowh{z-index:3}
.rx td.rowh a{text-decoration:none; display:block}
.rx td.rowh a:hover .un{text-decoration:underline}
.rx .un{font-weight:600; display:block}
.rx .um{color:var(--muted); font-size:12px}
.rx tr.sec td{background:var(--surface-2); font-size:12.5px; color:var(--muted); padding:5px 10px; position:sticky; left:0}
.none{color:var(--muted); font-size:12.5px}

/* rule drawer */
.drawer{position:fixed; left:0; right:0; bottom:0; z-index:20; padding:0 12px calc(12px + env(safe-area-inset-bottom,0px)); pointer-events:none}
.dr-in{pointer-events:auto; max-width:640px; margin:0 auto; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px 16px; box-shadow:0 10px 40px color-mix(in oklab, var(--ink) 22%, transparent)}
.dr-head{display:flex; justify-content:space-between; gap:12px; align-items:flex-start}
.dr-src{font-size:12.5px; color:var(--muted)}
.dr-in h4{font-family:var(--serif); font-size:26px; font-weight:600; margin:2px 0 0; line-height:1.1}
.dr-in p{margin:8px 0 6px; font-size:14.5px; max-width:68ch}
.x{border:1px solid var(--line); background:transparent; border-radius:999px; width:32px; height:32px; cursor:pointer; font-size:18px; line-height:1; color:var(--muted); flex:none}
.tog.big{font-size:15px; padding-top:6px}
@media (prefers-reduced-motion: no-preference){ .dr-in{animation:rise .18s ease-out} @keyframes rise{from{transform:translateY(12px); opacity:0} to{transform:none; opacity:1}} }
.wrap{padding-bottom:180px}

.foot{margin-top:36px; padding-top:14px; border-top:1px solid var(--line); color:var(--muted); font-size:13.5px; display:flex; flex-wrap:wrap; gap:8px 24px; justify-content:space-between}
.foot p{margin:0; max-width:80ch}
.check{color:var(--jade); font-weight:600}
.linkbtn{background:none; border:0; color:var(--jade); cursor:pointer; padding:0; text-decoration:underline; font-size:13.5px}
@media (prefers-reduced-motion: no-preference){
  .track .fill{transition:width .35s ease}
  .sigma.flash{animation:flash .5s ease}
  @keyframes flash{from{box-shadow:0 0 0 3px var(--jade)} to{box-shadow:0 0 0 0 transparent}}
}
</style>

// ===== Engine v2 =====
function avgDice(x){
  if (typeof x === 'number') return x;
  const m = String(x).trim().toUpperCase().match(/^(\d*)D(\d+)(?:\+(\d+))?$/);
  if (m){ const k = m[1] ? +m[1] : 1, f = +m[2], add = m[3] ? +m[3] : 0; return k*(f+1)/2 + add; }
  const n = parseFloat(x); return isNaN(n) ? 0 : n;
}
function diceDist(x){
  if (typeof x === 'number') return [[x,1]];
  const m = String(x).trim().toUpperCase().match(/^(\d*)D(\d+)(?:\+(\d+))?$/);
  if (!m){ const n = parseFloat(x); return [[isNaN(n)?0:n,1]]; }
  const k = m[1] ? +m[1] : 1, f = +m[2], add = m[3] ? +m[3] : 0;
  let dist = new Map([[0,1]]);
  for (let i=0;i<k;i++){ const nd = new Map(); for (const [v,p] of dist) for (let r=1;r<=f;r++) nd.set(v+r,(nd.get(v+r)||0)+p/f); dist = nd; }
  return [...dist].map(([v,p])=>[v+add,p]);
}
function woundNeed(S,T){ if (S>=2*T) return 2; if (S>T) return 3; if (S===T) return 4; if (2*S<=T) return 6; return 5; }
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const ruleKey = (owner,id)=>owner+':'+id;

// ----- modifier bar -----
const MOD0 = {apply:'both', hit:0, wound:0, ap:0, sus:false, lethal:false, rrHit:'off', rrWound:'off', cover:false, half:false, rf:0};
const RR_RANK = {off:0, '1s':1, full:2};
function modIsSet(m){ return !!m && Object.keys(MOD0).some(k=>k!=='apply' && m[k]!==undefined && m[k]!==MOD0[k]); }
function modScopes(unit, w){
  const s = ['all', unit.id];
  if (!unit.combined && unit.grp) s.push('grp-'+unit.grp);
  if (unit.combined && w && w._owner) s.push(w._owner);
  return [...new Set(s)];
}
function modsFor(unit, w, opts){
  const mods = opts.mods || {};
  const out = {hit:0, wound:0, ap:0, sus:false, lethal:false, rrHit:'off', rrWound:'off', cover:false, half:false, rf:0};
  for (const sc of modScopes(unit, w)){
    const m = mods[sc]; if (!modIsSet(m)) continue;
    if (m.cover) out.cover = true;
    if (m.half) out.half = true;
    const ok = !m.apply || m.apply==='both' || (m.apply==='ranged') === (w.t==='r');
    if (!ok) continue;
    out.hit += m.hit||0; out.wound += m.wound||0; out.ap += m.ap||0;
    if ((m.rf||0) > out.rf) out.rf = m.rf;
    if (m.sus) out.sus = true; if (m.lethal) out.lethal = true;
    if (RR_RANK[m.rrHit||'off'] > RR_RANK[out.rrHit]) out.rrHit = m.rrHit;
    if (RR_RANK[m.rrWound||'off'] > RR_RANK[out.rrWound]) out.rrWound = m.rrWound;
  }
  return out;
}

function effectiveRules(unit, allUnits){
  const out = [];
  const add = (owner, id) => { const r = RULES[id]; if (r && r.dmg && !out.some(x=>x.id===id && x.owner===owner)) out.push({id, owner, r}); };
  if (unit.combined){
    for (const mid of unit.members){ const m = allUnits.find(x=>x.id===mid); if (m) m.rules.forEach(id=>add(m.id,id)); }
  } else {
    (unit.rules||[]).forEach(id=>add(unit.id,id));
    if (unit.grp) for (const m of allUnits) if (m.grp===unit.grp && m.id!==unit.id) (m.rules||[]).forEach(id=>{ if (RULES[id] && RULES[id].scope==='unit') add(m.id,id); });
  }
  return out;
}
function ruleActive(er, opts){
  if (er.r.mark) return !!opts[er.r.mark];
  return !(opts.off && opts.off[ruleKey(er.owner, er.id)]);
}

function unitPts(unit, opts){ const e = unit.enh ? unit.enh.pts : 0; return opts.enh ? unit.pts : unit.pts - e; }

// rules the engine handles by name (calibrated before the generic effect system existed)
const LEGACY_FX = new Set(['piratical-hero','psyguide','raiders','spirit-marked','reavers','assured','faolchu','assassins-eye']);
// does a target match a keyword condition like {only:['MONSTER','VEHICLE']} or {not:[...]}?
function kwCond(c, tKw){
  if (!c) return true;
  const has = k => tKw.split(/[\s,]+/).includes(k) || tKw.includes(k);
  if (c.only && !c.only.some(has)) return false;
  if (c.not && c.not.some(has)) return false;
  return true;
}
function targetKw(tgt, opts){ let k = String(tgt.kw||'').toUpperCase(); if (opts.char && !/CHARACTER/.test(k)) k += ' CHARACTER'; return k; }

function attackUnit(unit, tgt, opts, allUnits, phase){
  phase = phase || opts.phase;
  allUnits = allUnits || [];
  const er = effectiveRules(unit, allUnits).filter(x=>ruleActive(x, opts));
  // target marks with a generic effect apply to every attacker in the list
  const marks = [];
  for (const [id, r] of Object.entries(RULES)) if (r.mark && r.global && r.fx && opts[r.mark]) marks.push({id, owner:'mark', r});
  let rows = [];
  for (const w of unit.w){
    if (phase==='ranged' && w.t!=='r') continue;
    if (phase==='melee' && w.t!=='m') continue;
    if (w.off){ rows.push({w, skipped:w.off}); continue; }
    // in a combined unit, a rule that isn't shared only covers its own datasheet's weapons
    const mine = er.filter(x=>!unit.combined || x.r.scope==='unit' || !w._owner || w._owner===x.owner).concat(marks);
    const has = id => mine.find(x=>x.id===id);
    rows.push(Object.assign({w}, attackWeapon(w, tgt, opts, has, modsFor(unit, w, opts), mine)));
  }
  // one profile per multi-profile weapon, one melee weapon per model
  const alts = {};
  rows.forEach(r=>{ if (r.w.alt && !r.skipped){ (alts[r.w.alt] = alts[r.w.alt]||[]).push(r); } });
  for (const k in alts){
    const g = alts[k]; const best = g.reduce((a,b)=>b.dealt>a.dealt?b:a);
    g.forEach(r=>{ if (r!==best){ r.skipped = /(^|:)m\d*:/.test(r.w.alt) ? 'This model fights with a better weapon here' : 'The other profile does more damage here'; r.dealt = 0; } });
  }
  let total = rows.reduce((s,r)=>s+(r.skipped?0:(r.dealt||0)),0);
  const pool = tgt.W*tgt.N;
  const capped = opts.cap && total > pool;
  if (opts.cap) total = Math.min(total, pool);
  const pts = unitPts(unit, opts);
  const ppw = tgt.pts/pool;
  return {rows, total, pts, ppw, roi: pts>0 ? total/pts*ppw*100 : 0, pool, capped, rules: er};
}

function attackWeapon(w, tgt, opts, has, md, ruleList){
  const notes = [];
  md = md || {hit:0, wound:0, ap:0, sus:false, lethal:false, rrHit:'off', rrWound:'off', cover:false, half:false, rf:0};
  const ranged = w.t==='r';
  const tKw = targetKw(tgt, opts);
  const vehMon = /VEHICLE|MONSTER/.test(tKw);
  // weapon abilities, minus any whose keyword condition the target doesn't meet
  const kw = Object.assign({}, w.kw || {});
  if (kw.when) for (const k of Object.keys(kw.when)) if (!kwCond(kw.when[k], tKw)) delete kw[k];

  const mn = [];
  if (md.hit) mn.push(`${md.hit>0?'+':'−'}${Math.abs(md.hit)} hit`);
  if (md.wound) mn.push(`${md.wound>0?'+':'−'}${Math.abs(md.wound)} wound`);
  if (md.ap) mn.push(`${md.ap>0?'+':'−'}${Math.abs(md.ap)} AP`);
  if (md.sus) mn.push('Sustained 1'); if (md.lethal) mn.push('Lethal');
  if (md.rrHit!=='off') mn.push(`re-roll hits ${md.rrHit==='1s'?'of 1':'(full)'}`);
  if (md.rrWound!=='off') mn.push(`re-roll wounds ${md.rrWound==='1s'?'of 1':'(full)'}`);
  if (md.rf && ranged && md.rf > (kw.rf||0) && !md.half) mn.push(`Rapid Fire ${md.rf} (idle: not within half range)`);
  if (mn.length) notes.push('Modifier: '+mn.join(', '));

  // generic rule effects (fx) from the rules library
  const fx = {hit:0, wound:0, s:0, ap:0, a:0, d:0, rrHit:null, rrWound:null};
  const RR = {null:0, ones:1, all:2};
  const bare = String(w.nm||'').replace(/^[^:]*:\s*/,'').toLowerCase();
  for (const x of (ruleList||[])){
    if (LEGACY_FX.has(x.id) || !x.r.fx) continue;
    let used = false;
    for (const e of [].concat(x.r.fx)){
      if (e.phase==='melee' && ranged) continue;
      if (e.phase==='ranged' && !ranged) continue;
      if (e.when && !opts[e.when]) continue;
      if (e.whenNot && opts[e.whenNot]) continue;
      if (e.vs && !kwCond(e.vs, tKw)) continue;
      if (e.weapon && !bare.includes(e.weapon)) continue;
      if (e.weaponNot && bare.includes(e.weaponNot)) continue;
      fx.hit += e.hit||0; fx.wound += e.wound||0; fx.s += e.s||0; fx.ap += e.ap||0; fx.a += e.a||0; fx.d += e.d||0;
      if (e.rrHit && RR[e.rrHit] > RR[fx.rrHit]) fx.rrHit = e.rrHit;
      if (e.rrWound && RR[e.rrWound] > RR[fx.rrWound]) fx.rrWound = e.rrWound;
      if (e.grant) for (const [k,v] of Object.entries(e.grant)){ if (typeof v==='number' && typeof kw[k]==='number') kw[k] = Math.max(kw[k], v); else if (!kw[k]) kw[k] = v; }
      used = true;
    }
    if (used) notes.push(x.r.nm);
  }

  // attacks
  let perModel = avgDice(w.A) + fx.a;
  if (fx.a) notes.push(`+${fx.a} A`);
  if (kw.blast){ const b = Math.floor(tgt.N/5) * (+kw.blast||1); if (b){ perModel += b; notes.push(`Blast +${b}`); } }
  if (kw.cleave && !ranged){ const b = Math.floor(tgt.N/5) * (+kw.cleave||1); if (b){ perModel += b; notes.push(`Cleave +${b}`); } }
  const rf = ranged ? Math.max(kw.rf||0, md.rf||0) : 0;
  if (rf && md.half){ perModel += rf; notes.push(`Rapid Fire +${rf}`); }
  const attacks = w.n * perModel;

  // modifiers
  let hitMod = md.hit + fx.hit, sus = Math.max(kw.sus || 0, md.sus ? 1 : 0), lethal = !!kw.lethal || md.lethal, rrHit = null, rrWound = kw.tl ? 'all' : null, rrDmg = false, ic = !!kw.ic, apB = md.ap + fx.ap, sB = fx.s, critOn = 6;
  if (has('piratical-hero')){ hitMod += 1; sus = Math.max(sus,1); notes.push('Piratical Hero'); }
  if (has('psyguide')){ hitMod += 1; notes.push('Psychic Guidance'); }
  if (opts.guide){ hitMod += 1; notes.push('Guide'); }
  if (kw.heavy && opts.stationary && ranged){ hitMod += 1; notes.push('Heavy'); }
  hitMod = clamp(hitMod,-1,1);
  if (has('raiders') && opts.quarry){ lethal = true; notes.push('Piratical Raiders'); }
  if (has('spirit-marked') && opts.spiritmark){ sus = Math.max(sus,1); notes.push('Spirit Mark'); }
  if (has('reavers')){ rrHit = opts.objective ? 'all' : 'ones'; notes.push(opts.objective ? 'Reavers: re-roll hits' : 'Reavers: re-roll 1s'); }
  if (has('assured') && ranged && vehMon){ rrHit = 'all'; rrWound = 'all'; rrDmg = true; notes.push('Assured Destruction'); }
  if (fx.rrHit && RR[fx.rrHit] > RR[rrHit]) rrHit = fx.rrHit;
  if (fx.rrWound && RR[fx.rrWound] > RR[rrWound]) rrWound = fx.rrWound;
  if (md.rrHit==='full') rrHit = 'all'; else if (md.rrHit==='1s' && !rrHit) rrHit = 'ones';
  if (md.rrWound==='full') rrWound = 'all'; else if (md.rrWound==='1s' && !rrWound) rrWound = 'ones';
  if (has('faolchu') && ranged){ ic = true; }
  if (has('assassins-eye') && ranged && opts.char){ apB += 1; notes.push('Assassins’ Eye +1 AP'); }
  if (opts.riven){ sB += 1; notes.push('Riven +1 S'); }
  if (opts.web){ critOn = 5; }

  // hit
  let pN, pC;
  if (kw.torrent){ pN = 1; pC = 0; notes.push('Torrent'); }
  else {
    let bs = w.sk;
    if (ranged && md.cover){ if (ic) notes.push('Ignores cover'); else { bs += 1; notes.push('Cover −1 BS'); } }
    const need = clamp(bs - hitMod, 2, 6);
    let pS = (7 - Math.min(need, critOn))/6, pc = (7 - critOn)/6;
    if (rrHit==='all'){ pc = pc + (1-pS)*pc; pS = pS + (1-pS)*pS; }
    else if (rrHit==='ones'){ pS = pS + pS/6; pc = pc + pc/6; }
    pN = pS - pc; pC = pc;
    if (critOn===5) notes.push('Whispering Web');
  }
  if (sus && pC) notes.push(`Sustained ${sus}`);
  if (lethal && pC) notes.push('Lethal Hits');
  const hitsPerAttack = pN + pC*(1+sus);
  const toRoll = pN + pC*sus + (lethal ? 0 : pC);
  const autoW = lethal ? pC : 0;

  // wound
  let wn = woundNeed(w.S + sB, tgt.T);
  if (fx.s) notes.push(`+${fx.s} S`);
  let wMod = md.wound + fx.wound;
  if (kw.lance && opts.charged && !ranged){ wMod += 1; notes.push('Lance'); }
  wn = clamp(wn - clamp(wMod,-1,1), 2, 6);
  let critW = 6;
  if (kw.anti && String(kw.anti[0]).split('/').some(k=>kwCond({only:[k]}, tKw))){ critW = Math.min(6, kw.anti[1]); notes.push(`Anti-${String(kw.anti[0]).toLowerCase()} ${kw.anti[1]}+`); }
  let qS = (7 - Math.min(wn, critW))/6, qC = (7 - critW)/6;
  if (rrWound==='all'){ qC = qC + (1-qS)*qC; qS = qS + (1-qS)*qS; if (kw.tl) notes.push('Twin-linked'); }
  else if (rrWound==='ones'){ qS = qS + qS/6; qC = qC + qC/6; }
  const rolledW = toRoll*qS, critWounds = toRoll*qC;
  const dev = !!kw.dev;
  const normalW = (dev ? rolledW - critWounds : rolledW) + autoW;
  const mortalW = dev ? critWounds : 0;
  if (dev && mortalW) notes.push('Devastating');
  const woundsPerAttack = rolledW + autoW;

  // save
  if (fx.ap) notes.push(`+${fx.ap} AP`);
  const sv = tgt.Sv + Math.max(0, (w.AP||0) + apB);
  const needS = tgt.inv ? Math.min(sv, tgt.inv) : sv;
  const pf = needS >= 7 ? 1 : clamp((needS-1)/6, 0, 1);

  // damage
  const melta = (kw.melta && md.half) ? kw.melta : 0;
  if (melta) notes.push(`Melta +${melta}`);
  if (fx.d) notes.push(`+${fx.d} D`);
  const add = melta + fx.d;
  const dist = diceDist(w.D);
  const capN = v => Math.min(tgt.dr ? Math.max(1, v+add-tgt.dr) : v+add, tgt.W);
  const capM = v => Math.min(v+add, tgt.W);
  const exp = (f) => { let e = 0; for (const [v,p] of dist) e += f(v)*p; if (rrDmg && dist.length>1){ const e1 = e; e = 0; for (const [v,p] of dist) e += Math.max(f(v), e1)*p; } return e; };
  const dN = exp(capN), dM = exp(capM);
  const fnpMul = tgt.fnp ? (tgt.fnp-1)/6 : 1;

  const unsavedPerAttack = normalW*pf + mortalW;
  const dealt = attacks * (normalW*pf*dN + mortalW*dM) * fnpMul;
  const wound = hitsPerAttack ? woundsPerAttack/hitsPerAttack : 0;
  const fail = woundsPerAttack ? unsavedPerAttack/woundsPerAttack : 0;
  const denom = attacks*hitsPerAttack*wound*fail;
  const dmg = denom ? dealt/denom : dN*fnpMul;
  if (kw.oneshot) notes.push('One Shot: once per battle');
  return {models:w.n, attacks, hit:hitsPerAttack, hitChance:pN+pC, susExtra:pC*sus, lethalShare: hitsPerAttack ? autoW/hitsPerAttack : 0, wound, fail, dmg, dealt, notes};
}

function attackerList(units, opts){
  if (!opts.combine) return units;
  const out = [], seen = new Set();
  for (const u of units){
    if (u.grp){ if (seen.has(u.grp)) continue; seen.add(u.grp); out.push(combineUnits(u.grp, units.filter(x=>x.grp===u.grp))); }
    else out.push(u);
  }
  return out;
}
function combineUnits(g, members){
  const short = m => m.nm.replace('Corsair ','').replace('Prince ','');
  const w = [];
  for (const m of members) for (const x of m.w) w.push(Object.assign({}, x, {nm:`${short(m)}: ${x.nm}`, alt: x.alt ? m.id+':'+x.alt : undefined, _owner: m.id}));
  const enhs = members.filter(m=>m.enh);
  return {
    id:'grp-'+g, nm: members.map(short).join(' + '), grp:g, combined:true, members: members.map(m=>m.id),
    pts: members.reduce((s,m)=>s+m.pts,0),
    enh: enhs.length ? {nm: enhs.map(m=>m.enh.nm).join(', '), pts: enhs.reduce((s,m)=>s+m.enh.pts,0), ids: enhs.map(m=>m.enh.id)} : null,
    models: members.reduce((s,m)=>s+m.models,0), w, rules:[],
  };
}


// ===== Roster importer (.ros / .rosz from 40k.app, NewRecruit, BattleScribe) =====
const IMP = (function(){
  const kids = (el, name) => el ? [...el.children].filter(c=>c.localName===name) : [];
  const kid = (el, name) => kids(el, name)[0] || null;

  const norm = s => String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’'`]/g,'').replace(/\(upgrade\)/g,'').replace(/[^a-z0-9]+/g,' ').trim();
  const slug = s => norm(s).replace(/ /g,'-') || 'x';
  const SMALL = new Set(['a','an','and','as','at','but','by','for','in','of','on','or','the','to','vs','with']);
  // all-caps list names read better in title case; anything already mixed-case is left alone
  const titleCase = s => s !== s.toUpperCase() ? s : s.toLowerCase().split(' ').map((w,i)=>(i>0 && SMALL.has(w)) ? w : w.charAt(0).toUpperCase()+w.slice(1)).join(' ');

  function parseKw(str){
    const kw = {}, other = [];

      let t = t0, cond = null;
      const ci = t0.indexOf(':');
      if (ci > 0){ t = t0.slice(0,ci).trim(); const c = t0.slice(ci+1).trim(); const neg = /^non-/i.test(c); const list = c.replace(/^non-/i,'').split(/[\/,]/).map(s=>s.trim().toUpperCase()).filter(Boolean); cond = neg ? {not:list} : {only:list}; }
      const l = t.toLowerCase(); let m;
      const before = JSON.stringify(kw);
      if (l==='assault' || l==='-' || l==='–' || l==='—' || l==='none') continue;
      else if (l==='pistol' || l==='close-quarters' || l==='close quarters') kw.pistol = 1;
      else if ((m = l.match(/^blast(?: (\d+|d3))?$/))) kw.blast = m[1] ? (m[1]==='d3' ? 2 : +m[1]) : 1;
      else if ((m = l.match(/^cleave (\d+|d3)/))) kw.cleave = m[1]==='d3' ? 2 : +m[1];
      else if (l==='one shot') kw.oneshot = 1;
      else if ((m = l.match(/^rapid fire (\d+)/))) kw.rf = +m[1];
      else if ((m = l.match(/^sustained hits (\d+|d3)/))) kw.sus = m[1]==='d3' ? 2 : +m[1];
      else if (l==='lethal hits') kw.lethal = 1;
      else if (l==='devastating wounds') kw.dev = 1;
      else if (l==='twin-linked') kw.tl = 1;
      else if (l==='torrent') kw.torrent = 1;

      else if (l==='heavy') kw.heavy = 1;
      else if (l==='lance') kw.lance = 1;
      else if (l==='ignores cover') kw.ic = 1;
      else if (l==='precision') kw.precision = 1;
      else if (l==='psychic') kw.psychic = 1;
      else if (l==='hazardous') kw.hazardous = 1;
      else if (l==='extra attacks') kw.extra = 1;
      else if (l==='indirect fire') kw.indirect = 1;
      else if ((m = l.match(/^anti-(.+?) (\d)\+$/))) kw.anti = [m[1].toUpperCase(), +m[2]];

    }
    if (other.length) kw.other = other;
    return kw;
  }
  const num = v => { const n = parseInt(String(v).replace(/[^\d-]/g,''),10); return isNaN(n) ? 0 : n; };
  const dice = v => { const s = String(v||'').trim().toUpperCase(); return /D/.test(s) ? s.replace(/\s+/g,'') : (parseFloat(s)||0); };
  function weaponFromProfile(p, count){
    const ch = {}; p.querySelectorAll('characteristic').forEach(c=>ch[c.getAttribute('name')] = (c.textContent||'').trim());
    const melee = p.getAttribute('typeName')==='Melee Weapons' || /^melee$/i.test(ch.Range||'');
    const kw = parseKw(ch.Keywords);
    const skill = ch[melee?'WS':'BS'] || '';
    return { nm: clean(p.getAttribute('name')), t: melee?'m':'r', n: count, A: dice(ch.A), sk: /n\/a/i.test(skill) || kw.torrent ? 0 : num(skill), S: num(ch.S), AP: Math.abs(num(ch.AP)), D: dice(ch.D), kw, range: ch.Range||'' };
  }

  const avgD = x => typeof x==='number' ? x : (()=>{ const m = String(x).match(/^(\d*)D(\d+)(?:\+(\d+))?$/); return m ? (m[1]?+m[1]:1)*(+m[2]+1)/2 + (m[3]?+m[3]:0) : 0; })();

  // ---------- model groups ----------

  function unitProfile(sel){
    const p = kids(kid(sel,'profiles'),'profile').find(p=>p.getAttribute('typeName')==='Unit');
    if (!p) return null;

  // ---------- rules ----------
  const STRUCTURAL = new Set(['attached to','led by','supported by','leader','support','invulnerable save','battle focus']);
  const CORE = ['scouts','stealth','deep strike','lone operative','infiltrators','deadly demise','fights first','feel no pain','firing deck','hover','leader','scout'];
  function libraryIndex(){ const m = {}; for (const [id,r] of Object.entries(BASE_RULES)) m[norm(r.nm)] = id; return m; }
  // "Damaged 4", "Deadly Demise D3", "Scouts 7"" → the name without its number
  const baseName = k => k.replace(/ (d?\d+|x)$/,'').replace(/ once per .*$/,'').trim();
  function looksOffensive(txt){
    const t = txt.toLowerCase();
    const terms = /hit roll|wound roll|strength characteristic|armour penetration|damage characteristic|re-?roll|\[(lethal|sustained|devastating|anti|twin|ignores|lance|precision|torrent|blast|melta|rapid)|critical (hit|wound)|attacks characteristic|mortal wound/.test(t);
    const ours = /makes an attack|makes a ranged attack|makes a melee attack|weapons equipped by|attacks? made by/.test(t);
    const theirs = /an attack targets (this|that) (unit|model)|attack (is )?allocated to|targets this unit|targets this model/.test(t);
    return terms && ours && !theirs;
  }

  // ---------- text export (points, enhancements, wargear names, detachments) ----------
  function parseText(text){
    const out = {name:'', faction:'', detachments:[], mission:'', units:{}, order:[], entries:[]};
    if (!text || !text.trim()) return out;
    const lines = text.replace(/\r/g,'').split('\n');
    const head = lines.filter(l=>l.trim()).slice(0,4);
    out.name = (head[0]||'').trim();
    const parts = (head[1]||'').split(/\s*[·•|]\s*/).map(s=>s.trim()).filter(Boolean);
    if (parts.length){ out.faction = parts[0]; out.detachments = parts.slice(1); }
    const mis = lines.find(l=>/^\s*Mission:/i.test(l)); if (mis) out.mission = mis.replace(/^\s*Mission:\s*/i,'').trim();
    let cur = null, curIndent = 0, section = '';
    for (const l of lines){
      const sec = l.match(/^(\S.*?) \[(\d+) pts\]\s*$/);
      if (sec){ section = sec[1].trim(); cur = null; continue; }
      const m = l.match(/^(\s+)(.+?) \[(\d+) pts\](?: \((\d+) models?\))?(?:\s*-\s*(.+?))?\s*$/);
      if (m){ cur = {nm:m[2].trim(), pts:+m[3], models:m[4]?+m[4]:null, enh:null, gear:'', tag:m[5]||'', section, idx:out.entries.length};
        curIndent = m[1].length; out.entries.push(cur); if (!out.units[norm(cur.nm)]) out.units[norm(cur.nm)] = cur; out.order.push(norm(cur.nm)); continue; }
      if (cur && /^\s/.test(l) && (l.match(/^\s*/)[0].length > curIndent)){
        const e = l.match(/Enhancement:\s*(.+?)\s*\(\+(\d+) pts\)/);
        if (e) cur.enh = {nm:e[1].trim(), pts:+e[2]}; else cur.gear += ' ' + l.trim();
      } else if (!/^\s/.test(l)) cur = null;
    }
    return out;
  }

  // ---------- main ----------
  function parse(xmlText, exportText){
    const doc = new DOMParser().parseFromString(xmlText, 'application/xml');
    if (doc.querySelector('parsererror')) throw new Error('That file isn’t valid roster XML.');
    const roster = doc.documentElement;
    if (roster.localName!=='roster') throw new Error('No <roster> found. Is this a BattleScribe/NewRecruit/40k.app roster?');
    const txt = parseText(exportText);
    const lib = libraryIndex();
    const warnings = [], rules = {}, units = [], armyFound = new Set();
    const tops = [];
    for (const f of roster.getElementsByTagNameNS('*','force')) for (const s of kids(kid(f,'selections'),'selection')){
      const t = s.getAttribute('type');
      if (t==='unit' || t==='model') tops.push(s);
    }
    const ids = new Set();
    for (const top of tops){
      const nm = clean(top.getAttribute('name'));
      let id = slug(nm); while (ids.has(id)) id += '-2'; ids.add(id);
      const cats = [...top.getElementsByTagNameNS('*','category')].map(c=>c.getAttribute('name')).filter(c=>c && !/^Faction:/i.test(c));
      const kw = [...new Set(cats.map(c=>c.toUpperCase()))];
      const isVM = kw.includes('VEHICLE') || kw.includes('MONSTER');
      // abilities
      const abil = kids(kid(top,'profiles'),'profile').filter(p=>p.getAttribute('typeName')==='Abilities').map(p=>({nm:clean(p.getAttribute('name')), txt:clean([...p.querySelectorAll('characteristic')].map(c=>c.textContent).join(' '))}));
      const get = n => abil.find(a=>a.nm.toLowerCase()===n);
      const unitRules = []; let enh = null;
      for (const a of abil){
        let name = a.nm, src = 'Datasheet';
        if (/^enhancement:/i.test(name)){ name = name.replace(/^enhancement:\s*/i,''); src = 'Enhancement'; }
        const key = norm(name);
        if (src!=='Enhancement' && STRUCTURAL.has(key)) continue;
        let rid = lib[key] || lib[baseName(key)];
        if (rid && BASE_RULES[rid].src==='Army rule'){ armyFound.add(rid); continue; }
        if (!rid){
          rid = 'imp-' + slug(name);
          if (!rules[rid]){
            const core = CORE.some(c=>key.startsWith(c));
            const leader = /while this model is leading a unit/i.test(a.txt);
            const body = (a.txt && a.txt.trim()!=='-') ? a.txt : '(no text in the roster file)';
            rules[rid] = {nm:name, src: src==='Enhancement' ? 'Enhancement' : core ? 'Core' : leader ? 'Leader' : 'Datasheet', dmg:false, txt:body, imported:true,
              scope: /leading a unit|a model in this unit|models in this unit/i.test(a.txt) ? 'unit' : undefined, todo: !core && looksOffensive(a.txt)};
          }
        }
        if (src==='Enhancement') enh = {id:rid, nm:name, pts:0};
        if (!unitRules.includes(rid)) unitRules.push(rid);
      }
      // weapons: per model group, then merge
      let groups = modelGroups(top).filter(g=>g.items.length || g.prof);
      // merge groups with identical loadouts
      const merged = [];
      for (const g of groups){
        const sig = JSON.stringify(g.items.map(i=>profKey(i.w)).sort());
        const same = merged.find(m=>m.sig===sig);
        if (same){ same.n += g.n; same.items.forEach((it,ix)=>{ const o = g.items.find(x=>profKey(x.w)===profKey(it.w)); if (o) it.w.n += o.w.n; }); }
        else merged.push(Object.assign({}, g, {sig}));
      }
      const w = [];
      merged.forEach((g, gi)=>{
        const items = g.items.map(i=>Object.assign({}, i, {w:Object.assign({}, i.w)}));
        // one weapon with several profiles, or "Name - profile" siblings: pick one per attack
        const byBase = {};
        items.forEach(i=>{ const base = i.multi ? i.upg : (i.w.nm.includes(' - ') ? i.w.nm.split(' - ')[0] : null); if (base) (byBase[base] = byBase[base]||[]).push(i); });
        for (const [base, list] of Object.entries(byBase)) if (list.length>1) list.forEach(i=>i.w.alt = `p${gi}:${slug(base)}`);
        // pistol rule
        const ranged = items.filter(i=>i.w.t==='r');
        if (!isVM && ranged.some(i=>!i.w.kw.pistol) ) ranged.filter(i=>i.w.kw.pistol).forEach(i=>i.w.off = 'Fires its other guns instead (pistol rule)');
        // melee: drop weapons that another option beats outright, then pick per target
        let melee = items.filter(i=>i.w.t==='m' && !i.w.kw.extra && !i.w.alt);
        melee = melee.filter(i=>!melee.some(j=>j!==i && dominates(j.w, i.w) && profKey(j.w)!==profKey(i.w)));
        if (melee.length>1) melee.forEach(i=>i.w.alt = `m${gi}:melee`);
        items.forEach(i=>{ if (i.w.t==='m' && !i.w.kw.extra && !i.w.alt && !melee.includes(i)) i.drop = true; });
        items.filter(i=>!i.drop).forEach(i=>w.push(i.w));
      });
      // merge identical rows that aren't choices
      const rows = [];
      for (const x of w){
        const same = !x.alt && rows.find(r=>!r.alt && profKey(r)===profKey(x) && (r.off||'')===(x.off||''));
        if (same) same.n += x.n; else rows.push(x);
      }
      rows.forEach(r=>{ delete r.range; });
      rows.sort((a,b)=>(a.t===b.t?0:(a.t==='r'?-1:1)) || (a.off?1:0)-(b.off?1:0));
      const models = groups.reduce((s,g)=>s+g.n,0) || 1;
      const prof = (groups.find(g=>g.prof)||{}).prof || null;
      const inv = get('invulnerable save'); 
      const u = { id, nm, pts:0, models, kw, rules:unitRules, w:rows, grp:null, role:null, cat:null,
        stats: prof ? Object.assign({}, prof, {inv: inv ? num(inv.txt) : 0, invRangedOnly: inv ? /ranged attacks only/i.test(inv.txt) : false}) : null,
        _attachedTo: (get('attached to')||{}).txt || null, _ledBy: (get('led by')||get('supported by')||{}).txt || null, _support: !!get('support') && !get('leader') };
      if (enh) u.enh = enh;
      units.push(u);
    }

    // points, enhancement costs and wargear from the text export
    // match roster units to text-export entries: unique exact names first, then by the attached-unit section
    // their leader sits in (text exports repeat names like "Outrider Squad"), then by name without an A/B letter
    const used = new Set(), match = new Map(), fuzzy = new Set();
    const E = txt.entries || [];
    const take = (u, e) => { match.set(u, e); used.add(e.idx); };
    const baseN = s => norm(s).replace(/ [a-z]$/,'');
    for (const u of units){ const c = E.filter(e=>!used.has(e.idx) && norm(e.nm)===norm(u.nm)); if (c.length===1) take(u, c[0]); }
    for (const u of units){
      if (match.has(u)) continue;
      const partners = [u._ledBy, u._attachedTo].filter(Boolean).map(n=>units.find(x=>norm(x.nm)===norm(n))).filter(Boolean);
      const lead = units.filter(x=>x._attachedTo && norm(x._attachedTo)===norm(u.nm));
      const secs = new Set([...partners, ...lead].map(x=>match.get(x)).filter(Boolean).map(e=>e.section));
      const c = E.filter(e=>!used.has(e.idx) && secs.has(e.section) && baseN(e.nm)===baseN(u.nm));
      if (c.length) take(u, c.find(e=>e.models===u.models) || c[0]);
    }
    for (const u of units){
      if (match.has(u)) continue;
      const c = E.filter(e=>!used.has(e.idx) && baseN(e.nm)===baseN(u.nm));
      const pick = c.find(e=>e.models===u.models) || c[0];
      if (pick){ take(u, pick); fuzzy.add(u); }
    }
    for (const u of units){
      const t = match.get(u);
      if (!t){ if (Object.keys(txt.units).length) warnings.push(`${u.nm}: not found in the text export, so it has no points yet.`); continue; }
      if (fuzzy.has(u)) warnings.push(`${u.nm} matched to “${t.nm}” in the text export (${t.pts} pts) by name only. Check that’s the right one.`);
      if (/warlord/i.test(t.tag||'')) u.warlord = true;
      u.pts = t.pts;
      if (t.enh){ if (u.enh) u.enh.pts = t.enh.pts; else warnings.push(`${u.nm}: the text export lists ${t.enh.nm}, but the roster file doesn’t.`); }
      const gear = norm(t.gear);
      for (const [id, r] of Object.entries(BASE_RULES)) if (r.src==='Wargear' && gear.includes(norm(r.nm)) && !u.rules.includes(id)) u.rules.push(id);
    }
    const unmatched = E.filter(e=>!used.has(e.idx));
    if (unmatched.length) warnings.push(`In the text export but not the roster file: ${unmatched.map(e=>e.nm).join(', ')}.`);
    if (!Object.keys(txt.units).length) warnings.push('No text export, so every unit starts at 0 pts. Add points below before saving.');
    // rules that grant other rules (e.g. Spirit Mark → Wraith Constructs)
    const all = new Set(units.flatMap(u=>u.rules));
    for (const id of all){ const g = (BASE_RULES[id]||{}).grants; if (g) units.forEach(u=>{ if (u.kw.includes(g.kw) && !u.rules.includes(g.rule)) u.rules.push(g.rule); }); }

    // leaders
    const byName = n => units.find(u=>norm(u.nm)===norm(n));
    const groups = {}; const order = [];
    for (const u of units){
      if (!u._attachedTo) continue;
      const bg = byName(u._attachedTo);
      if (!bg){ warnings.push(`${u.nm} is attached to “${u._attachedTo}”, which isn’t in the roster.`); continue; }
      let key = bg.id;
      if (!groups[key]){ groups[key] = {bg, leaders:[]}; order.push(key); }
      groups[key].leaders.push(u);
    }
    const pos = u => { const e = match.get(u); return e ? e.idx : 999 + units.indexOf(u); };
    order.sort((a,b)=>Math.min(...groups[a].leaders.map(pos), pos(groups[a].bg)) - Math.min(...groups[b].leaders.map(pos), pos(groups[b].bg)));
    const short = n => n.replace(/^Corsair /,'').replace(/^Prince /,'');
    const G = {};
    order.forEach((k, i)=>{
      const L = String.fromCharCode(65+i), g = groups[k];
      G[L] = {nm:`Attached unit ${L}`, short: [...g.leaders.map(l=>short(l.nm)), short(g.bg.nm)].join(' + ')};
      g.leaders.forEach(l=>{ l.grp = L; l.role = l._support ? 'Support' : 'Leader'; });
      g.bg.grp = L; g.bg.role = 'Bodyguard';
    });
    // sections for everything else
    const SEC = ['Characters','Battleline','Dedicated transport','Infantry','Mounted','Beasts and swarms','Vehicles and monsters','Other'];
    for (const u of units){
      const k = u.kw;
      u.cat = k.includes('CHARACTER') ? 'Characters' : k.includes('BATTLELINE') ? 'Battleline' : k.includes('DEDICATED TRANSPORT') ? 'Dedicated transport'
        : (k.includes('VEHICLE')||k.includes('MONSTER')) ? 'Vehicles and monsters' : k.includes('MOUNTED') ? 'Mounted' : k.includes('INFANTRY') ? 'Infantry' : (k.includes('BEASTS')||k.includes('SWARM')) ? 'Beasts and swarms' : 'Other';
      if (u.grp && u.role!=='Bodyguard' && !u.kw.includes('CHARACTER')) u.cat = 'Characters';
      if (u._ledBy && !u.grp) warnings.push(`${u.nm} says it’s led by ${u._ledBy}, but that leader doesn’t point back to it.`);
      delete u._attachedTo; delete u._ledBy; delete u._support;
    }
    units.sort((a,b)=>{
      if (a.grp || b.grp){ if (!a.grp) return 1; if (!b.grp) return -1; if (a.grp!==b.grp) return a.grp<b.grp?-1:1; const o = {Leader:0, Support:1, Bodyguard:2}; return o[a.role]-o[b.role]; }
      return SEC.indexOf(a.cat)-SEC.indexOf(b.cat) || pos(a)-pos(b);
    });

    // army and detachment rules we know about
    const army = [];
    const facKey = norm(txt.faction || (roster.querySelector('force')||{getAttribute:()=>''}).getAttribute('catalogueName'));
    (FACTION_ARMY_RULES[facKey]||[]).forEach(id=>army.push(id));
    armyFound.forEach(id=>{ if (!army.includes(id)) army.push(id); });
    const dets = txt.detachments.length ? txt.detachments : [];
    const unknownDets = [];
    dets.forEach(d=>{ const r = DETACHMENT_RULES[norm(d)]; if (r) r.forEach(id=>{ if (!army.includes(id)) army.push(id); }); else unknownDets.push(d); });

    const force = roster.getElementsByTagNameNS('*','force')[0];
    const meta = {
      name: titleCase(txt.name || clean(roster.getAttribute('name')) || 'Imported list'),
      faction: txt.faction || (force && force.getAttribute('catalogueName')) || '',
      detachments: dets, mission: txt.mission,
    };
    meta.sub = [meta.faction, dets.join(' and '), meta.mission].filter(Boolean).join(', ') + '. Imported from a roster file.';
    const stats = {
      units: units.length, models: units.reduce((s,u)=>s+u.models,0), weapons: units.reduce((s,u)=>s+u.w.length,0),
      known: [...new Set(units.flatMap(u=>u.rules).concat(army))].filter(id=>BASE_RULES[id]).length,
      newRules: Object.keys(rules).length, todo: Object.values(rules).filter(r=>r.todo).length, unknownDets,
    };
    // detachment rules that hand a named unit an extra ability (e.g. Wrath of the First Khan)
    army.forEach(id=>(DETACHMENT_UNIT_GRANTS[id]||[]).forEach(g=>units.forEach(u=>{ if (norm(u.nm).includes(g.name) && !u.rules.includes(g.rule)) u.rules.push(g.rule); })));
    if (unknownDets.length) warnings.push(`No rules library yet for ${unknownDets.join(' or ')}. Its detachment rules won’t show until we add them.`);
    return {meta, units, groups:G, armyRules:army, rules, warnings, stats, gameSystem: roster.getAttribute('gameSystemName')||''};
  }

  async function readFile(file){
    const buf = await file.arrayBuffer();
    const head = new Uint8Array(buf.slice(0,4));
    const isZip = head[0]===0x50 && head[1]===0x4b;
    if (!isZip) return new TextDecoder('utf-8').decode(buf);
    if (typeof JSZip==='undefined') throw new Error('Couldn’t load the unzip library for .rosz files. Export as .ros instead, or try again online.');
    const zip = await JSZip.loadAsync(buf);
    const entry = Object.values(zip.files).find(f=>!f.dir && /\.ros$/i.test(f.name)) || Object.values(zip.files).find(f=>!f.dir);
    if (!entry) throw new Error('The .rosz archive is empty.');
    return entry.async('string');
  }
  return {parse, readFile, parseText, parseKw};
})();

const extraList = L => ({id:L.id, builtin:true, meta:L.meta, groups:L.groups, armyRules:L.armyRules, rules:L.rules, base:L.units, units:clone(L.units)});
const S = { lists:Object.assign({builtin:builtinList()}, ...EXTRA_BUILTIN_LISTS.map(L=>({[L.id]:extraList(L)}))), listId:'builtin-burning-v2', units:null, targets: clone(DEFAULT_TARGETS), opts: freshOpts(), edit:false, rule:null, modScope:'all', pending:null, importErr:null };
S.units = S.lists.builtin.units;
(function load(){
  try {
    let d = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
    if (!d){ const old = JSON.parse(localStorage.getItem(LS_OLD) || 'null'); if (old) d = {opts:old.opts, targets:old.targets, lists:{builtin:{units:old.units}}, listId:'builtin'}; }
    if (!d) return;
    if (d.lists){ for (const [id, L] of Object.entries(d.lists)){ if (S.lists[id] && S.lists[id].builtin){ if (L.units) S.lists[id].units = L.units; } else S.lists[id] = L; } }
    if (d.listId && S.lists[d.listId]) S.listId = d.listId;
    if (d.targets) S.targets = d.targets;
    if (d.opts) S.opts = Object.assign(freshOpts(), d.opts);
    // older saves kept cover and half range as global switches
    if (S.opts.cover || S.opts.half){ S.opts.mods.all = Object.assign({}, MOD0, S.opts.mods.all||{}, S.opts.cover?{cover:true}:{}, S.opts.half?{half:true}:{}); }
    delete S.opts.cover; delete S.opts.half;
  } catch(e){}
})();
function save(){
  try {
    const lists = {};
    for (const [id, L] of Object.entries(S.lists)) lists[id] = L.builtin ? {units:L.units} : L;
    localStorage.setItem(LS_KEY, JSON.stringify({lists, listId:S.listId, targets:S.targets, opts:S.opts}));
  } catch(e){}
}
function applyList(id){

// target marks only count when a unit in this list can set them
function availableMarks(){ const m = new Set(); for (const u of S.units) for (const id of (u.rules||[])) if (RULES[id] && RULES[id].mark) m.add(RULES[id].mark); return m; }
function effOpts(o){

const esc = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function heat(roi){
  if (roi >= 100){ const m = Math.min(85, 62 + (roi-100)/4); return {bg:`color-mix(in oklab, var(--gold) ${m}%, var(--surface))`, fg:'var(--gold-ink)', cls:'eff'}; }
  if (roi >= 65){ const m = 36 + (roi-65)/35*26; return {bg:`color-mix(in oklab, var(--jade) ${m}%, var(--surface))`, fg:'var(--jade-ink)', cls:'eff'}; }
  if (roi >= 35){ const m = 7 + (roi-35)/30*17; return {bg:`color-mix(in oklab, var(--jade) ${m}%, var(--surface))`, fg:'var(--ink)', cls:''}; }
  return {bg:'transparent', fg:'var(--muted)', cls:''};
}

// ---------- rule state ----------
function ruleState(owner, id){
  const r = RULES[id];
  if (!r) return 'note';
  if (r.mark) return S.opts[r.mark] ? 'mark-on' : 'mark-off';
  if (!r.dmg) return r.todo ? 'todo' : 'note';
  if (S.opts.off[ruleKey(owner,id)]) return 'off';
  return (r.cond && !S.opts[r.cond]) ? 'idle' : 'on';
}
function chip(owner, id, label){
  const st = ruleState(owner, id), r = RULES[id];
  const sel = S.rule && S.rule.id===id && S.rule.owner===owner ? ' sel' : '';
  const title = st==='todo' ? 'Looks like it changes damage, but it isn’t modelled yet' : st==='note' ? 'Real rule, no effect on damage dealt' : st==='idle' ? `Waiting for: ${r.condNm}` : (st.startsWith('mark') ? 'Target mark' : (st==='on'?'Counted in the maths':'Switched off'));
  return `<button type="button" class="chip ${st}${sel}" data-rule="${id}" data-owner="${owner}" title="${esc(title)}">${esc(label || r.nm)}</button>`;
}

// ---------- modifier bar ----------
const MOD_GROUPS = [
  [['hit','Hit',[[-1,'−1'],[0,'Off'],[1,'+1']],'Net change capped at ±1'], ['wound','Wound',[[-1,'−1'],[0,'Off'],[1,'+1']],'Net change capped at ±1'], ['ap','AP',[[-2,'−2'],[-1,'−1'],[0,'Off'],[1,'+1'],[2,'+2'],[3,'+3']],'Changes the AP characteristic, so it stacks with Assassins’ Eye. −1 is Armour of Contempt']],
  [['sus','Sustained 1',[[false,'Off'],[true,'On']]], ['lethal','Lethal',[[false,'Off'],[true,'On']]], ['rrHit','Re-roll hit',[['off','Off'],['1s','1s'],['full','Full']]], ['rrWound','Re-roll wound',[['off','Off'],['1s','1s'],['full','Full']]]],
  [['cover','Cover',[[false,'Off'],[true,'On']],'Ranged only'], ['half','Half range',[[false,'Off'],[true,'On']],'Melta, Rapid Fire'], ['rf','Rapid Fire',[[0,'Off'],[1,'1'],[2,'2'],[3,'3'],[4,'4']],'Extra attacks per gun, only within half range. Takes the higher of this and the weapon’s own']],
];
function scopeName(sc){
  if (sc==='all') return 'All units';
  const u = findUnit(sc);
  return u ? `${u.nm}${u.sub?` (${u.sub})`:''}` : sc;
}
function modSummary(m){
  const p = [];
  if (m.hit) p.push(`${m.hit>0?'+':'−'}1 hit`); if (m.wound) p.push(`${m.wound>0?'+':'−'}1 wound`); if (m.ap) p.push(`${m.ap>0?'+':'−'}${Math.abs(m.ap)} AP`);
  if (m.sus) p.push('Sustained 1'); if (m.lethal) p.push('Lethal');
  if (m.rrHit && m.rrHit!=='off') p.push(`re-roll hits ${m.rrHit==='1s'?'of 1':'in full'}`);
  if (m.rrWound && m.rrWound!=='off') p.push(`re-roll wounds ${m.rrWound==='1s'?'of 1':'in full'}`);
  if (m.rf) p.push(`Rapid Fire ${m.rf}${m.half?'':' (needs half range)'}`);
  const scoped = p.length && m.apply && m.apply!=='both' ? `${p.join(', ')} (${m.apply} only)` : p.join(', ');
  const extra = []; if (m.cover) extra.push('target in cover'); if (m.half) extra.push('half range');
  return [scoped, extra.join(', ')].filter(Boolean).join('; ');
}
function rowModified(u){
  const sc = new Set([u.id]);
  if (!u.combined && u.grp) sc.add('grp-'+u.grp);
  if (u.combined) u.members.forEach(m=>sc.add(m));
  return [...sc].some(s=>modIsSet(S.opts.mods[s]));
}
function renderModBar(){
  const sc = S.modScope, m = Object.assign({}, MOD0, S.opts.mods[sc]||{});
  const seg = (key, list) => `<span class="seg sm" role="group" aria-label="${esc(key)}">${list.map(([v,l])=>`<button type="button" data-mod="${key}" data-mval="${String(v)}" aria-pressed="${String(m[key])===String(v)}">${l}</button>`).join('')}</span>`;
  const combined = attackerList(S.units, Object.assign({}, S.opts, {combine:true})).filter(u=>u.combined);
  const opt = (id, label) => `<option value="${id}" ${id===sc?'selected':''}>${esc(label)}${modIsSet(S.opts.mods[id])?' •':''}</option>`;
  const options = opt('all','All units')
    + `<optgroup label="Attached units">${combined.map(u=>opt(u.id,u.nm)).join('')}</optgroup>`
    + `<optgroup label="Datasheets">${S.units.map(u=>opt(u.id, u.nm + (u.sub?` (${u.sub})`:''))).join('')}</optgroup>`;
  const groups = MOD_GROUPS.map((g,gi)=>`<div class="mcluster c${gi+2}">${g.map(([k,l,list,note])=>`<div class="mg"><span class="ml">${l}</span>${seg(k,list)}${note?`<span class="mnote">${note}</span>`:''}</div>`).join('')}</div>${gi===0?'<span class="mbreak" aria-hidden="true"></span>':''}`).join('');
  const active = Object.keys(S.opts.mods).filter(k=>modIsSet(S.opts.mods[k]));
  if (S.modOpen === undefined) S.modOpen = window.innerWidth > 760;
  return `<details class="modwrap" ${S.modOpen?'open':''}><summary>Modifiers: ${active.length ? `${active.length} set` : 'none'}</summary><div class="modbar" role="group" aria-label="Modifiers">
      <div class="mcluster c1">
        <div class="mg"><label class="ml" for="modscope">Unit</label><select id="modscope" data-modscope>${options}</select></div>
        <div class="mg"><span class="ml">Applies to</span>${seg('apply',[['both','Both'],['ranged','Ranged'],['melee','Melee']])}</div>
      </div>
      ${groups}
      ${modIsSet(S.opts.mods[sc]) ? `<button class="btn ghost" type="button" data-act="mod-clear">Clear ${sc==='all'?'all-units':'this unit’s'} modifiers</button>` : ''}
    </div>
    <p class="modsum">${active.length ? 'Modifiers in play: ' + active.map(k=>`<b>${esc(scopeName(k))}</b> ${esc(modSummary(S.opts.mods[k]))}`).join('. ') + '.' : 'No modifiers. Pick a unit (or all of them) and set a buff or debuff; it stacks with the list’s own rules, capped at ±1 to hit and wound.'}</p></details>`;
}

// ---------- damage matrix ----------
function renderMatrix(){
  const R = rows();
  const M = R.map(u=>({u, cells:S.targets.map(t=>atk(u,t))}));
  const inf = S.targets.filter(t=>t.cls==='inf'), veh = S.targets.filter(t=>t.cls!=='inf');
  const ordered = inf.concat(veh), idx = ordered.map(t=>S.targets.indexOf(t));
  const colCls = t => t.id===veh[0]?.id ? 'first-veh' : (t.id===inf[0]?.id ? 'first-inf' : '');
  let body = '', last = null;
  for (const {u,cells} of M){
    const sec = sectionOf(u);
    if (sec!==last){ body += `<tr class="sec"><td colspan="${ordered.length+3}">${esc(sec)}</td></tr>`; last = sec; }
    const vals = cells.map(c=>c.roi), avg = vals.reduce((a,b)=>a+b,0)/vals.length;
    let bi = 0; vals.forEach((v,i)=>{ if (v>vals[bi]) bi=i; });
    body += `<tr><td class="rowh"><a href="#/unit/${u.id}"><span class="un">${esc(u.nm)}${rowModified(u)?'<span class="modtag">modified</span>':''}</span><span class="um">${esc(unitSub(u))}</span></a></td>`;
    ordered.forEach((t,k)=>{ const c = cells[idx[k]], h = heat(c.roi);
      body += `<td class="c ${h.cls} ${colCls(t)}"><a href="#/unit/${u.id}/vs/${t.id}" style="background:${h.bg};color:${h.fg}" title="${esc(u.nm)} into ${esc(t.nm)}: ${f1(c.roi)}%">${Math.round(c.roi)}</a></td>`; });
    body += `<td class="agg">${Math.round(avg)}</td><td class="agg best" title="${esc(S.targets[bi].nm)}">${esc(S.targets[bi].nm)}</td></tr>`;
  }
  const cov = ordered.map((t,k)=>M.filter(r=>r.cells[idx[k]].roi>=65).length);
  body += `<tr class="cov"><td class="rowh">Units at 65% or better</td>${cov.map((n,k)=>`<td class="${n===0?'zero':''} ${colCls(ordered[k])}">${n}</td>`).join('')}<td></td><td></td></tr>`;
  const head = `<tr class="grp"><th class="rowh"></th><th class="inf" colspan="${inf.length}">Infantry and beasts</th><th class="veh" colspan="${veh.length}">Vehicles and monsters</th><th colspan="2"></th></tr>
    <tr><th class="rowh corner">Your unit, then target</th>${ordered.map(t=>`<th class="tg ${colCls(t)}"><a href="#/target/${t.id}"><span class="tn">${esc(t.nm)}</span><span class="tm">T${t.T}, ${t.pts} pts</span></a></th>`).join('')}
    <th class="tg aggh">Avg</th><th class="tg aggh l">Best into</th></tr>`;
  $('#view').innerHTML = `
    <div class="legend">
      <div class="eq">Return = <em>wounds dealt</em> ÷ <em>your points</em> × <em>their points per wound</em></div>
      <div class="keyrow">
        <span><span class="sw" style="background:${heat(120).bg}"></span>100%+ pays for itself</span>
        <span><span class="sw" style="background:${heat(80).bg}"></span>65–99% efficient</span>
        <span><span class="sw" style="background:${heat(50).bg}"></span>35–64% chip damage</span>
        <span>${esc(phaseLabel(S.opts.phase))}. Every damage rule in the list is applied unless you switch it off in the rules matrix.</span>
      </div>
    </div>
    <div class="mx-scroll"><table class="mx"><thead>${head}</thead><tbody>${body}</tbody></table></div>
    <ul class="findings">${findings(M, ordered, idx).join('')}</ul>`;
}

function findings(M, ordered, idx){
  const out = [];
  const best = ordered.map((t,k)=>{ let b=null; for (const r of M){ const c=r.cells[idx[k]]; if (!b || c.roi>b.c.roi) b={u:r.u,c}; } return {t,b}; });
  const weak = best.filter(x=>x.b.c.roi<65).sort((a,b)=>a.b.c.roi-b.b.c.roi);
  if (weak.length){ const w = weak[0];
    out.push(`<li class="alert">Nothing here removes <a href="#/target/${w.t.id}">${esc(w.t.nm)}</a> efficiently. Your best answer is <a href="#/unit/${w.b.u.id}/vs/${w.t.id}">${esc(w.b.u.nm)}</a> at <b>${f1(w.b.c.roi)}%</b>${weak.length>1?`, and ${weak.length-1} other target${weak.length>2?'s sit':' sits'} under the 65% line too`:''}.</li>`);
  } else out.push(`<li>Every benchmark target has at least one answer at 65% or better.</li>`);
  const counts = M.map(r=>({u:r.u, n:r.cells.filter(c=>c.roi>=65).length, peak:r.cells.reduce((m,c,i)=>c.roi>m.roi?{roi:c.roi,i}:m,{roi:-1,i:0})})).sort((a,b)=>b.n-a.n || b.peak.roi-a.peak.roi);
  const p = counts[0];
  out.push(`<li class="gold"><a href="#/unit/${p.u.id}">${esc(p.u.nm)}</a> is your prime trigger: 65% or better into <b>${p.n} of ${ordered.length}</b> targets, peaking at ${f1(p.peak.roi)}% into ${esc(S.targets[p.peak.i].nm)}.</li>`);
  if (S.opts.enh){
    const members = u => u.combined ? u.members.map(unitById) : [u];
    const avg = (u, o) => S.targets.reduce((s,t)=>s+atk(u,t,o).roi,0)/S.targets.length;
    const taxed = M.filter(r=>r.u.enh).map(r=>{
      const a = r.cells.reduce((s,c)=>s+c.roi,0)/r.cells.length;
      const free = avg(r.u, Object.assign({}, S.opts, {enh:false}));
      const off = Object.assign({}, S.opts.off); members(r.u).forEach(m=>{ if (m && m.enh) off[ruleKey(m.id, m.enh.id)] = true; });
      const none = avg(r.u, Object.assign({}, S.opts, {enh:false, off}));
      const adds = members(r.u).some(m=>{ const er = m && m.enh && RULES[m.enh.id]; return er && er.dmg && (!er.cond || S.opts[er.cond]); });
      return {u:r.u, a, free, none, adds};
    }).sort((x,y)=>(y.free-y.a)-(x.free-x.a));
    if (taxed.length){ const r = taxed[0];
      out.push(r.adds
        ? `<li><a href="#/unit/${r.u.id}">${esc(r.u.nm)}</a> pays ${r.u.enh.pts} pts for ${esc(r.u.enh.nm)}, the biggest enhancement cost in the list. With it the unit averages <b>${f1(r.a)}%</b>; without it at all, ${f1(r.none)}%. ${Math.abs(r.a - r.none) < 2 ? 'It roughly breaks even on damage alone.' : r.a > r.none ? 'Its damage more than covers its cost.' : 'Its damage doesn’t cover its cost against these targets.'}</li>`
        : `<li><a href="#/unit/${r.u.id}">${esc(r.u.nm)}</a> pays ${r.u.enh.pts} pts for ${esc(r.u.enh.nm)}, which adds no damage against these targets, so its average return drops from ${f1(r.free)}% to <b>${f1(r.a)}%</b>. That’s the biggest enhancement cost in the list.</li>`);
    }
  }
  return out;
}

// ---------- unit dossier ----------
function kwText(w){
  const k = w.kw||{}, t=[];
  // conditional abilities read like "Lethal Hits (not vs monster/vehicle)"
  const cnd = key => { const c = k.when && k.when[key]; if (!c) return ''; return c.not ? ` (not vs ${c.not.join('/').toLowerCase()})` : ` (vs ${c.only.join('/').toLowerCase()})`; };
  const push = t.push.bind(t);
  t.push = (s, key) => push(s + (key ? cnd(key) : ''));
  if (k.torrent) t.push('Torrent'); if (k.lethal) t.push('Lethal Hits','lethal'); if (k.sus) t.push(`Sustained ${k.sus}`,'sus');
  if (k.tl) t.push('Twin-linked','tl'); if (k.dev) t.push('Devastating','dev'); if (k.lance) t.push('Lance','lance');
  if (k.blast) t.push(k.blast>1?`Blast ${k.blast}`:'Blast'); if (k.cleave) t.push(`Cleave ${k.cleave}`); if (k.melta) t.push(`Melta ${k.melta}`); if (k.heavy) t.push('Heavy'); if (k.rf) t.push(`Rapid Fire ${k.rf}`);
  if (k.anti) t.push(`Anti-${String(k.anti[0]).toLowerCase()} ${k.anti[1]}+`); if (k.pistol) t.push('Pistol / close-quarters'); if (k.ic) t.push('Ignores Cover','ic');
  if (k.precision) t.push('Precision','precision'); if (k.psychic) t.push('Psychic'); if (k.extra) t.push('Extra Attacks'); if (k.oneshot) t.push('One Shot');
  if (k.hazardous) t.push('Hazardous'); if (k.indirect) t.push('Indirect Fire'); if (k.other) t.push(...k.other);
  if (w.alt) t.push(/(^|:)m\d*:/.test(w.alt) ? 'one melee weapon per model' : 'pick one profile');
  return t.join(', ');
}
function kwSerialize(k){ k=k||{}; const t=[];
  ['torrent','lethal','tl','dev','lance','blast','heavy','pistol','ic','precision','psychic','extra'].forEach(x=>{ if(k[x]) t.push(x); });
  if (k.sus) t.push('sus'+k.sus); if (k.melta) t.push('melta'+k.melta); if (k.rf) t.push('rf'+k.rf); if (k.anti) t.push(`anti-${k.anti[0].toLowerCase()}${k.anti[1]}`);
  return t.join(' '); }
function kwParse(s){ const k={};
  for (let tok of String(s).toLowerCase().split(/[\s,]+/).filter(Boolean)){
    tok = tok.replace(/twin-?linked/,'tl').replace(/^ignores?-?cover$/,'ic').replace(/^devastating$/,'dev').replace(/\+$/,''); let m;
    if ((m = tok.match(/^(sus|sustained)(\d)$/))) k.sus=+m[2];
    else if ((m = tok.match(/^melta(\d)$/))) k.melta=+m[1];
    else if ((m = tok.match(/^(rf|rapidfire)(\d)$/))) k.rf=+m[2];
    else if ((m = tok.match(/^anti-([a-z]+?)(\d)$/))) k.anti=[m[1].toUpperCase(), +m[2]];
    else if (['torrent','lethal','tl','dev','lance','blast','heavy','pistol','ic','precision','psychic','extra'].includes(tok)) k[tok]=1;
  } return k; }

function rulesInPlay(u){
  const er = effectiveRules(u, S.units);
  const members = u.combined ? u.members.map(unitById) : [u];
  const noteCount = members.reduce((s,m)=>s+(m.rules||[]).filter(id=>RULES[id] && !RULES[id].dmg).length,0);
  const chips = er.map(x=>chip(x.owner, x.id, (x.owner===u.id || u.combined) ? RULES[x.id].nm : `${RULES[x.id].nm} ← ${shortNm(unitById(x.owner).nm)}`)).join('');
  return `<h3 class="sh">Rules in play <span>${er.length ? 'tap one to read or switch it' : 'none of this unit’s rules change damage'}</span></h3>
    ${er.length?`<div class="chips">${chips}</div>`:''}
    ${noteCount?`<p class="hint">${noteCount} more rule${noteCount>1?'s':''} on ${u.combined?'these datasheets':'this datasheet'} don’t change damage. <a href="#/rules">See them in the rules matrix</a>.</p>`:''}`;
}

function detailTable(r){
  const tr = r.rows.map(x=>{
    if (x.skipped) return `<tr class="skip"><td><span class="wn">${esc(x.w.nm)}</span><span class="wnotes">${esc(x.skipped)}</span></td><td>${x.w.t==='r'?'ranged':'melee'}</td><td>${x.w.n}</td><td colspan="6">not used</td></tr>`;
    return `<tr><td><span class="wn">${esc(x.w.nm)}</span>${x.notes.length?`<span class="wnotes">${esc(x.notes.join(', '))}</span>`:''}</td><td>${x.w.t==='r'?'ranged':'melee'}</td><td>${x.models}</td><td>${f1(x.attacks)}</td><td>${f1(x.hitChance*100)}%${x.susExtra>0.0005?`<span class="sub">+${f1(x.susExtra*100)} sustained</span>`:''}</td><td>${f1(x.wound*100)}%${x.lethalShare>0.0005?`<span class="sub">incl. lethal</span>`:''}</td><td>${f1(x.fail*100)}%</td><td>${f2(x.dmg)}</td><td class="dealt">${f2(x.dealt)}</td></tr>`;
  }).join('');
  return `<div class="tbl-scroll"><table class="dt"><thead><tr><th>Weapon</th><th>Type</th><th>Models</th><th>Attacks</th><th title="Chance to hit. The small line is extra hits per attack from Sustained Hits">Hit</th><th title="Wounds per hit. Lethal Hits count as automatic wounds">Wound</th><th title="Share of wounds that get past saves">Fail save</th><th>Dmg/wound</th><th>Wounds dealt</th></tr></thead><tbody>${tr || `<tr><td colspan="9" class="emptyrow">No ${S.opts.phase==='ranged'?'ranged':'melee'} weapons on this unit.</td></tr>`}</tbody></table></div>`;
}

function sigma(u, t, r){
  const cls = r.roi>=100?'hi':(r.roi<35?'lo':'');
  const share = r.total/r.pool*100;
  let alt = '';
  if (u.enh && S.opts.enh){ const off = atk(u,t,Object.assign({},S.opts,{enh:false})); alt = `Without ${esc(u.enh.nm)} (${off.pts} pts) the same attacks return ${f1(off.roi)}%.`; }
  const poolLine = r.capped ? `That wipes all ${r.pool} wounds; the extra is ignored because overkill is capped.`
    : share>=100 ? `That’s more than the unit’s ${r.pool} wounds, so ${f1(r.total-r.pool)} of it is overkill unless you switch on the cap.`
    : `That’s ${Math.round(share)}% of the unit’s ${r.pool} wounds.`;
  return `<div class="sigma" id="sigma">
    <div class="line">
      <span class="term">Σ ${f2(r.total)}<small>wounds dealt</small></span>
      <span class="op">(</span><span class="term">${f2(r.total)}<small>wounds</small></span><span class="op">÷</span><span class="term">${r.pts}<small>your points</small></span><span class="op">)</span>
      <span class="op">×</span><span class="term">${f1(r.ppw)}<small>their pts per wound</small></span>
      <span class="op">×</span><span class="term">100</span><span class="op">=</span><span class="term res ${cls}">${f1(r.roi)}%<small>return</small></span>
    </div>
    <p>${esc(u.nm)} ${u.combined?'remove':'removes'} about <b>${Math.round(r.total*r.ppw)} pts</b> of ${esc(t.nm)} for the ${r.pts} pts ${u.combined?'they cost':'spent'}. ${poolLine}</p>
    ${alt?`<p class="alt">${alt}</p>`:''}
  </div>`;
}

function loadout(u){
  const editable = S.edit && !u.combined;
  const btn = u.combined ? '' : `<div class="editbar"><button class="btn ${S.edit?'primary':''}" type="button" data-act="toggle-edit">${S.edit?'Done editing':'Edit profiles'}</button>

  const rowsHtml = u.w.map((w,i)=>{
    if (!editable) return `<tr class="${w.off?'skip':''}"><td><span class="wn">${esc(w.nm)}</span>${w.off?`<span class="wnotes">${esc(w.off)}</span>`:''}</td><td>${w.t==='r'?'ranged':'melee'}</td><td>${w.n}</td><td>${esc(w.A)}</td><td>${w.kw&&w.kw.torrent?'N/A':w.sk+'+'}</td><td>${w.S}</td><td>${w.AP?'-'+w.AP:'0'}</td><td>${esc(w.D)}</td><td class="l">${esc(kwText(w))}</td></tr>`;
    const inp = (f,v,c='') => `<input class="${c}" data-u="${u.id}" data-i="${i}" data-f="${f}" value="${esc(v)}">`;

  }).join('');
  const help = editable ? `<p class="hint">Abilities are typed as words: torrent lethal sus1 tl dev lance blast melta2 heavy rf1 anti-infantry2 pistol ic. Changes save in this browser and recalculate everything.</p>` : '';
  return btn + `<div class="tbl-scroll"><table class="dt"><thead><tr><th>Weapon</th><th>Type</th><th>Models</th><th>A</th><th>BS/WS</th><th>S</th><th>AP</th><th>D</th><th class="l">Abilities</th></tr></thead><tbody>${rowsHtml}</tbody></table></div>` + help;
}

let lastPath = '';
function route(){
  const h = location.hash.replace(/^#\/?/,'').split('/');
  const view = h[0]==='rules' ? 'rules' : h[0]==='import' ? 'import' : (h[0]==='unit'||h[0]==='target' ? 'detail' : 'matrix');
  renderListPick();

  if (h[0]==='import'){ $('#controls').innerHTML = renderTabsOnly(view); renderImport(); renderDrawer(); renderFoot(); return; }
  if (h[0]==='unit' && h[1]) renderUnit(h[1], h[2]==='vs' ? h[3] : null);
  else if (h[0]==='target' && h[1]) renderTarget(h[1]);
